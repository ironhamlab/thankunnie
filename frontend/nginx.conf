# HTTP: 인증서 갱신 경로와 컨테이너 상태 확인만 제공
# 나머지 요청은 HTTPS로 전환
server {
    listen 80 default_server;
    server_name dev.thankunnie.shop api-dev.thankunnie.shop;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# 개발 프론트
server {
    listen 443 ssl;
    server_name dev.thankunnie.shop;

    ssl_certificate /etc/letsencrypt/live/unnie-dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unnie-dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # 알림 SSE 연결
    location = /api/v1/notifications/inbox/stream {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location = /api {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

