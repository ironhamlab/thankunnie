services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PASSWORD: LocalAdmin123
      APP_USER: SCOTT
      APP_USER_PASSWORD: TIGER
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  oracle-data: