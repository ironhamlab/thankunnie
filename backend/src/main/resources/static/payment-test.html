<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제 테스트</title>
    <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
</head>
<body>
<button onclick="pay()">100원 테스트 결제</button>
<pre id="result"></pre>
<script>
    IMP.init("imp46782436");

    function pay() {
        IMP.request_pay({
            pg: "html5_inicis",
            pay_method: "card",
            merchant_uid: "TEST_" + Date.now(),
            name: "결제 테스트",
            amount: 100
        }, async (rsp) => {
            if (!rsp.success) {
                alert("결제 실패: " + rsp.error_msg);
                return;
            }
            const res = await fetch("/api/v1/payments/verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ impUid: rsp.imp_uid })
            });
            document.getElementById("result").textContent = JSON.stringify(await res.json(), null, 2);
        });
    }
</script>
</body>
</html>
