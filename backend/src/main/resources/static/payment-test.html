<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>결제 테스트</title>
    <script src="https://cdn.iamport.kr/v1/iamport.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px 16px 48px;
            background: #f5f6f8;
            color: #1f2329;
            font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            font-size: 15px;
        }
        main { max-width: 720px; margin: 0 auto; }
        h1 { font-size: 22px; margin: 0 0 4px; }
        .desc { color: #6b7280; margin: 0 0 20px; }
        .step {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 14px;
        }
        .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .step-num {
            width: 26px; height: 26px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            background: #e5e7eb; color: #4b5563; font-weight: 700; font-size: 13px;
        }
        .step-title { font-weight: 700; font-size: 16px; }
        .step-state { margin-left: auto; font-size: 13px; color: #9ca3af; }
        .step.running .step-num { background: #3b82f6; color: #fff; }
        .step.running .step-state { color: #3b82f6; }
        .step.ok .step-num { background: #16a34a; color: #fff; }
        .step.ok .step-state { color: #16a34a; }
        .step.fail .step-num { background: #dc2626; color: #fff; }
        .step.fail .step-state { color: #dc2626; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        label { font-size: 13px; color: #6b7280; }
        input {
            padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 14px; min-width: 0;
        }
        button {
            padding: 9px 16px; border: 0; border-radius: 8px; cursor: pointer;
            background: #2563eb; color: #fff; font-size: 14px; font-weight: 600;
        }
        button.secondary { background: #4b5563; }
        button:disabled { background: #9ca3af; cursor: default; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 7px 4px; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
        th { width: 34%; color: #6b7280; font-weight: 500; }
        td { word-break: break-all; }
        .badge {
            display: inline-block; padding: 2px 10px; border-radius: 999px;
            font-size: 13px; font-weight: 600;
        }
        .badge.paid { background: #dcfce7; color: #166534; }
        .badge.ready { background: #fef9c3; color: #854d0e; }
        .badge.cancelled, .badge.failed { background: #fee2e2; color: #991b1b; }
        .match { font-weight: 600; }
        .match.same { color: #16a34a; }
        .match.diff { color: #dc2626; }
        .error-box {
            background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;
            padding: 12px 14px; color: #991b1b;
        }
        .error-box .code { font-family: Consolas, monospace; font-weight: 700; }
        .error-box .hint { color: #7f1d1d; font-size: 13px; margin-top: 6px; }
        .empty { color: #9ca3af; font-size: 14px; }
        details { margin-top: 12px; }
        summary { cursor: pointer; font-size: 13px; color: #6b7280; }
        pre {
            background: #111827; color: #e5e7eb; padding: 12px; border-radius: 8px;
            overflow-x: auto; font-size: 12px; margin: 8px 0 0;
        }
        .divider { border-top: 1px dashed #e5e7eb; margin: 14px 0; }
    </style>
</head>
<body>
<main>
    <h1>포트원 결제 테스트</h1>
    <p class="desc">KG이니시스 테스트 채널 · 결제창 결과를 서버(<code>/api/v1/payments/verify</code>)에서 포트원에 다시 조회해 검증함</p>

    <section class="step" id="step1">
        <div class="step-head">
            <span class="step-num">1</span>
            <span class="step-title">결제 요청</span>
            <span class="step-state">대기</span>
        </div>
        <div class="row">
            <div>
                <label for="amount">결제 금액(원)</label><br>
                <input id="amount" type="number" value="100" min="100" step="100" style="width: 120px">
            </div>
            <div style="flex: 1">
                <label for="productName">상품명</label><br>
                <input id="productName" type="text" value="결제 테스트" style="width: 100%">
            </div>
            <div>
                <br>
                <button id="payButton" onclick="pay()">테스트 결제</button>
            </div>
        </div>
        <div id="requestInfo"></div>
    </section>

    <section class="step" id="step2">
        <div class="step-head">
            <span class="step-num">2</span>
            <span class="step-title">결제창 결과 (브라우저)</span>
            <span class="step-state">대기</span>
        </div>
        <div id="pgResult"><p class="empty">결제창을 닫으면 결과가 여기에 표시됨</p></div>
    </section>

    <section class="step" id="step3">
        <div class="step-head">
            <span class="step-num">3</span>
            <span class="step-title">서버 검증 (포트원 재조회)</span>
            <span class="step-state">대기</span>
        </div>
        <div id="verifyResult"><p class="empty">결제가 성공하면 서버가 포트원에 다시 조회한 결과가 표시됨</p></div>

        <div class="divider"></div>
        <label for="manualImpUid">imp_uid 로 다시 조회 (없는 값을 넣으면 에러 응답 확인 가능)</label>
        <div class="row" style="margin-top: 4px">
            <input id="manualImpUid" type="text" placeholder="imp_123456789012" style="flex: 1">
            <button class="secondary" onclick="verifyManual()">조회</button>
        </div>
    </section>
</main>

<script>
    IMP.init("imp46782436");

    const STATUS_LABELS = {
        paid: "결제 완료",
        ready: "미결제",
        cancelled: "취소됨",
        failed: "결제 실패"
    };

    // 서버 ErrorCode 별로 원인을 짐작할 수 있게 안내 문구를 붙인다
    const ERROR_HINTS = {
        PAYMENT_001: "포트원에 해당 결제가 없음. imp_uid 오타이거나, 테스트 결제인데 서버 include-sandbox 가 false 인 경우",
        PAYMENT_002: "포트원 호출 실패. imp-key/imp-secret 설정, 네트워크(학원망이면 VM 옵션), 포트원 응답 지연을 확인",
        COMMON_400: "요청 값이 잘못됨. imp_uid 가 비어 있는지 확인"
    };

    let requestedAmount = null;

    function pay() {
        const amount = Number(document.getElementById("amount").value);
        const name = document.getElementById("productName").value.trim() || "결제 테스트";
        if (!Number.isInteger(amount) || amount < 100) {
            alert("결제 금액은 100원 이상 정수로 입력");
            return;
        }

        const merchantUid = "TEST_" + Date.now();
        requestedAmount = amount;
        resetStep("step2", "pgResult", "결제창을 닫으면 결과가 여기에 표시됨");
        resetStep("step3", "verifyResult", "결제가 성공하면 서버가 포트원에 다시 조회한 결과가 표시됨");
        setStep("step1", "running", "결제창 진행 중");
        document.getElementById("payButton").disabled = true;
        renderTable("requestInfo", [
            ["PG", "html5_inicis (KG이니시스)"],
            ["결제 수단", "card"],
            ["주문번호 (merchant_uid)", merchantUid],
            ["요청 금액", formatWon(amount)]
        ]);

        IMP.request_pay({
            pg: "html5_inicis",
            pay_method: "card",
            merchant_uid: merchantUid,
            name: name,
            amount: amount
        }, async (rsp) => {
            document.getElementById("payButton").disabled = false;
            setStep("step1", "ok", "요청 완료");

            if (!rsp.success) {
                setStep("step2", "fail", "결제 실패·취소");
                const box = document.getElementById("pgResult");
                box.replaceChildren(errorBox("결제창", rsp.error_msg || "결제가 완료되지 않음", null,
                    "사용자가 결제창을 닫았거나 카드 승인이 거절된 경우. 서버 검증은 하지 않음"));
                appendRaw(box, rsp);
                setStep("step3", "", "건너뜀");
                return;
            }

            setStep("step2", "ok", "결제창 성공");
            const pgBox = document.getElementById("pgResult");
            renderTable("pgResult", [
                ["imp_uid", rsp.imp_uid],
                ["merchant_uid", rsp.merchant_uid],
                ["결제 금액", formatWon(rsp.paid_amount)],
                ["결제 수단", rsp.pay_method]
            ]);
            const note = document.createElement("p");
            note.className = "empty";
            note.textContent = "브라우저에서 받은 값은 조작될 수 있으므로 3단계에서 서버가 포트원에 다시 확인함";
            pgBox.appendChild(note);
            appendRaw(pgBox, rsp);

            document.getElementById("manualImpUid").value = rsp.imp_uid;
            await verify(rsp.imp_uid);
        });
    }

    function verifyManual() {
        const impUid = document.getElementById("manualImpUid").value.trim();
        if (!impUid) {
            alert("imp_uid 를 입력");
            return;
        }
        requestedAmount = null;
        verify(impUid);
    }

    async function verify(impUid) {
        setStep("step3", "running", "검증 중");
        const box = document.getElementById("verifyResult");
        box.replaceChildren();

        let res;
        let body;
        try {
            res = await fetch("/api/v1/payments/verify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ impUid: impUid })
            });
            body = await res.json();
        } catch (e) {
            setStep("step3", "fail", "요청 실패");
            box.replaceChildren(errorBox("네트워크", e.message, null,
                "백엔드 서버가 실행 중인지, 이 페이지를 백엔드 주소(localhost:8080)로 열었는지 확인"));
            return;
        }

        if (!body.success) {
            setStep("step3", "fail", "검증 실패 (HTTP " + res.status + ")");
            const code = body.error ? body.error.code : "UNKNOWN";
            const message = body.error ? body.error.message : "알 수 없는 오류";
            box.replaceChildren(errorBox(code, message, res.status, ERROR_HINTS[code]));
            appendRaw(box, body);
            return;
        }

        const data = body.data;
        const isPaid = data.status === "paid";
        setStep("step3", isPaid ? "ok" : "fail", isPaid ? "검증 완료" : "결제 상태 확인 필요");

        const rows = [
            ["상태", badge(data.status)],
            ["imp_uid", data.impUid],
            ["merchant_uid", data.merchantUid],
            ["결제 금액", formatWon(data.amount)],
            ["결제 수단", data.payMethod],
            ["결제 시각", data.paidAt ? formatDateTime(data.paidAt) : "-"]
        ];
        if (requestedAmount !== null) {
            rows.push(["요청 금액과 비교", amountMatch(requestedAmount, data.amount)]);
        }
        renderTable("verifyResult", rows);
        appendRaw(box, body);
    }

    function setStep(stepId, state, text) {
        const step = document.getElementById(stepId);
        step.classList.remove("running", "ok", "fail");
        if (state) {
            step.classList.add(state);
        }
        step.querySelector(".step-state").textContent = text;
    }

    function resetStep(stepId, boxId, emptyText) {
        setStep(stepId, "", "대기");
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = emptyText;
        document.getElementById(boxId).replaceChildren(empty);
    }

    // 값은 textContent 로만 넣어 응답 문자열이 HTML 로 해석되지 않게 한다
    function renderTable(boxId, rows) {
        const table = document.createElement("table");
        for (const [label, value] of rows) {
            const tr = document.createElement("tr");
            const th = document.createElement("th");
            th.textContent = label;
            const td = document.createElement("td");
            if (value instanceof Node) {
                td.appendChild(value);
            } else {
                td.textContent = value === null || value === undefined ? "-" : String(value);
            }
            tr.append(th, td);
            table.appendChild(tr);
        }
        document.getElementById(boxId).replaceChildren(table);
    }

    function errorBox(code, message, httpStatus, hint) {
        const box = document.createElement("div");
        box.className = "error-box";
        const title = document.createElement("div");
        const codeEl = document.createElement("span");
        codeEl.className = "code";
        codeEl.textContent = code;
        title.append(codeEl, (httpStatus ? " · HTTP " + httpStatus : "") + " · " + message);
        box.appendChild(title);
        if (hint) {
            const hintEl = document.createElement("div");
            hintEl.className = "hint";
            hintEl.textContent = "확인할 것: " + hint;
            box.appendChild(hintEl);
        }
        return box;
    }

    function appendRaw(box, json) {
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "원본 JSON 보기";
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(json, null, 2);
        details.append(summary, pre);
        box.appendChild(details);
    }

    function badge(status) {
        const el = document.createElement("span");
        el.className = "badge " + status;
        el.textContent = (STATUS_LABELS[status] || status) + " (" + status + ")";
        return el;
    }

    // 화면 확인용 비교. 실제 금액 검증은 서버에서 주문 금액과 비교해야 함
    function amountMatch(requested, verified) {
        const el = document.createElement("span");
        const same = Number(requested) === Number(verified);
        el.className = "match " + (same ? "same" : "diff");
        el.textContent = same
            ? "일치 (" + formatWon(requested) + ")"
            : "불일치 - 요청 " + formatWon(requested) + " / 실제 " + formatWon(verified);
        return el;
    }

    function formatWon(value) {
        return value === null || value === undefined ? "-" : Number(value).toLocaleString("ko-KR") + "원";
    }

    function formatDateTime(isoText) {
        // 서버가 +09:00 으로 주므로 앞부분만 읽기 좋게 자른다
        return isoText.replace("T", " ").substring(0, 19) + " (KST)";
    }
</script>
</body>
</html>
