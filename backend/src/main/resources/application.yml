# 공통 설정: 환경별 값은 application-{profile}.yml 에 둔다
spring:
  application:
    name: thankunnie
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      # 내장 DB(H2)일 때만 docs/erd/01_schema_ddl.sql 로 테이블을 만든다. Oracle(prod)에는 실행하지 않는다
      mode: embedded
      schema-locations: classpath:db/01_schema_ddl.sql

app:
  cors:
    # 쉼표로 여러 Origin 지정 가능
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

iamport:
  base-url: https://api.iamport.kr
  # 실제 키는 application-local.yml 또는 환경변수로 주입한다
  imp-key: ${IAMPORT_IMP_KEY:}
  imp-secret: ${IAMPORT_IMP_SECRET:}
  # 테스트 채널 결제까지 조회할지 여부. 운영에서는 반드시 false
  include-sandbox: ${IAMPORT_INCLUDE_SANDBOX:false}
