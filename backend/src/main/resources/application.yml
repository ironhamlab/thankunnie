# 공통 설정: 환경별 값은 application-{profile}.yml 에 둔다
spring:
  application:
    name: thankunnie
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # H2 에서만 NUMBER 컬럼 검증을 맞춘 방언을 쓴다 (Oracle 은 기본 방언)
        dialect_resolvers: com.ucamp.app.config.H2OracleModeDialectResolver
  sql:
    init:
      # 내장 DB(H2)일 때만 schema.sql(빌드 시 docs/erd/01_schema_ddl.sql 에서 복사)로 테이블을 만든다.
      # Oracle(prod)에는 실행하지 않는다
      mode: embedded
      schema-locations: classpath:schema.sql

app:
  cors:
    # 쉼표로 여러 Origin 지정 가능
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
