# 공통 설정: 환경별 값은 application-{profile}.yml 에 둔다
spring:
  application:
    name: thankunnie
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  cors:
    # 쉼표로 여러 Origin 지정 가능
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
