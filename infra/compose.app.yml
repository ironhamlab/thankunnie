name: unnie-app

services:
  backend:
    image: ${BACKEND_IMAGE:-unnie-backend:local}

    build:
      context: ..
      dockerfile: backend/Dockerfile

    restart: unless-stopped
    mem_limit: 2g

    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      DB_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      DB_USERNAME: ${APP_USER:?Required}
      DB_PASSWORD: ${APP_USER_PASSWORD:?Required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Required}
      IAMPORT_IMP_KEY: ${IAMPORT_IMP_KEY:-}
      IAMPORT_IMP_SECRET: ${IAMPORT_IMP_SECRET:-}
      IAMPORT_INCLUDE_SANDBOX: "false"

    networks:
      - unnie-network

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:-unnie-frontend:local}

    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - unnie-network

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  unnie-network:
    external: true